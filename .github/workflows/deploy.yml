name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Test — run the test suite. If anything fails the pipeline stops here.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./dev-ops/DeployReady/app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./dev-ops/DeployReady/app

      - name: Run tests
        run: npm test
        working-directory: ./dev-ops/DeployReady/app

      # Step 2: Build — build the Docker image and tag it with the Git commit SHA.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dev-ops/DeployReady/app
          push: true
          platforms: linux/arm64, linux/amd64
          tags: ${{ secrets.DOCKERHUB_NAME }}/amalitech-deployready:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to VM
        run: |
          az vm run-command invoke \
            --resource-group AMALITECH \
            --name myVM \
            --command-id RunShellScript \
            --scripts '
              docker pull ${{ secrets.DOCKERHUB_NAME }}/amalitech-deployready:${{ github.sha }}

              docker stop amalitech-deployready || true
              docker rm amalitech-deployready || true

              docker run -d \
                --name amalitech-deployready \
                -p 127.0.0.1:3000:3000 \
                --env-file /home/azureuser/amalitech-deployready/.env \
                ${{ secrets.DOCKERHUB_NAME }}/amalitech-deployready:${{ github.sha }}
            '