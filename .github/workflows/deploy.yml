name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Test — run the test suite. If anything fails the pipeline stops here.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./dev-ops/DeployReady/app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./dev-ops/DeployReady/app

      - name: Run tests
        run: npm test
        working-directory: ./dev-ops/DeployReady/app

      # Step 2: Build — build the Docker image and tag it with the Git commit SHA.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dev-ops/DeployReady/app
          push: true
          platforms: linux/arm64, lineux/amd64
          tags: ${{ secrets.DOCKERHUB_NAME }}/amalitech-deployready:${{ github.sha }}

      # Step 3: Deploy — SSH into the server, pull the new image, and restart the container.
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_NAME }}/amalitech-deployready:${{ github.sha }}
            docker stop amalitech-deployready || true
            docker rm amalitech-deployready || true
            docker run -d --name amalitech-deployready -p 3000:3000 --env-file /home/azureuser/amalitech-deployready/.env ${{ secrets.DOCKERHUB_NAME }}/amalitech-deployready:${{ github.sha }}